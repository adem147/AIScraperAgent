<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procurement Opportunities</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div class="page-container">
    
    <!-- Header -->
    <header class="top-bar">
      <div>
        <h1 class="page-title">Procurement Opportunities</h1>
        <p class="page-desc">Top 5 results fetched from SQLite database (CERT.db)</p>
      </div>

      <div class="actions">
        <button id="btn-refresh" class="btn">Refresh</button>
        <button id="btn-run" class="btn btn-primary">Run main.py</button>
      </div>
    </header>

    <!-- Notification Message -->
    <div id="msg" class="msg-box hidden"></div>

    <!-- Table of Results -->
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th style="width: 40px;">#</th>
            <th>Title & Description</th>
            <th style="width: 170px;">Organization / Country</th>
            <th style="width: 140px;">Sector</th>
            <th style="width: 110px;">Deadline</th>
            <th style="width: 70px;">Score</th>
            <th style="width: 60px;">Link</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr>
            <td colspan="7" class="text-center">Loading opportunities from database...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <footer class="footer-note">
      <span id="update-time">Ready</span>
    </footer>

  </div>

  <script src="/static/app.js"></script>
</body>
</html>
